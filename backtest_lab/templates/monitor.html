{% extends "base.html" %}
{% block title %}Monitor en Vivo — Trading Bot v11{% endblock %}

{% block head %}
<style>
  .mon-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 10px; margin-bottom: 8px;
    background: #1a1d27; border: 1px solid #2d3148;
    transition: border-color .2s;
  }
  .mon-row:hover { border-color: #3b82f6; }
  .mon-dot {
    width: 12px; height: 12px; border-radius: 50%;
    flex-shrink: 0; margin-top: 2px;
  }
  .dot-ok      { background: #34d399; box-shadow: 0 0 6px #34d39966; }
  .dot-warn    { background: #fbbf24; box-shadow: 0 0 6px #fbbf2466; }
  .dot-error   { background: #f87171; box-shadow: 0 0 6px #f8717166; }
  .dot-neutral { background: #475569; }
  .dot-timeout { background: #a78bfa; }
  .mon-icon  { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }
  .mon-label { font-size: .9rem; font-weight: 600; color: #e2e8f0; min-width: 195px; }
  .mon-detail{ font-size: .78rem; color: #94a3b8; flex: 1; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .mon-ago   { font-size: .72rem; color: #60a5fa; white-space: nowrap; flex-shrink: 0; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .summary-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 12px; border-radius: 20px; font-size: .75rem; font-weight: 600;
  }
  .pill-ok    { background: #065f46; color: #34d399; }
  .pill-warn  { background: #78350f; color: #fbbf24; }
  .pill-error { background: #7f1d1d; color: #f87171; }
  .refresh-bar {
    height: 3px; background: #2d3148; border-radius: 2px;
    overflow: hidden; margin-bottom: 1rem;
  }
  .refresh-bar-fill {
    height: 100%; background: #3b82f6; border-radius: 2px;
    transition: width .5s linear;
  }
  #spinner-row { display: none; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <h4 class="mb-0 fw-bold text-blue"><i class="bi bi-activity me-2"></i>Monitor en Vivo</h4>
    <div class="text-muted small mt-1" id="ts-label">Cargando...</div>
  </div>
  <div class="d-flex align-items-center gap-2">
    <span id="summary-pills"></span>
    <button class="btn btn-sm btn-outline-secondary" onclick="fetchNow()">
      <i class="bi bi-arrow-clockwise me-1"></i>Refrescar
    </button>
    <a href="/" class="btn btn-sm btn-outline-secondary">← Backtest</a>
  </div>
</div>

<!-- Barra de progreso de auto-refresh -->
<div class="refresh-bar">
  <div class="refresh-bar-fill" id="refresh-bar" style="width:100%"></div>
</div>

<!-- Spinner inicial -->
<div id="spinner-row" class="text-center py-4 text-muted">
  <div class="spinner-border spinner-border-sm text-primary me-2"></div>
  Conectando con el VPS...
</div>

<!-- Filas de estado -->
<div id="monitor-rows"></div>

{% endblock %}

{% block scripts %}
<script>
const REFRESH_SECS = 30;
let countdown = 0;
let timer = null;
let barTimer = null;

const DOT_CLASS   = { ok:'dot-ok', warn:'dot-warn', error:'dot-error', neutral:'dot-neutral', timeout:'dot-timeout' };
const ICON_COLOR  = { ok:'text-green', warn:'text-warning', error:'text-red', neutral:'text-muted', timeout:'text-purple' };
const STATUS_LBL  = { ok:'OK', warn:'AVISO', error:'ERROR', neutral:'—', timeout:'TIMEOUT' };
const BADGE_CLS   = { ok:'badge-pass', warn:'badge-warn', error:'badge-fail', neutral:'badge text-muted bg-dark', timeout:'badge text-purple bg-dark' };

function renderRows(data) {
  document.getElementById("ts-label").textContent = "Actualizado: " + data.timestamp;

  // Pills resumen
  const pills = document.getElementById("summary-pills");
  pills.innerHTML = `
    <span class="summary-pill pill-ok"><i class="bi bi-check-circle-fill"></i>${data.n_ok} OK</span>
    ${data.n_err > 0 ? `<span class="summary-pill pill-error"><i class="bi bi-x-circle-fill"></i>${data.n_err} Error</span>` : ''}
  `;

  const container = document.getElementById("monitor-rows");
  container.innerHTML = "";
  for (const item of data.items) {
    const dotCls  = DOT_CLASS[item.status]  || 'dot-neutral';
    const iconCls = ICON_COLOR[item.status] || 'text-muted';
    const badge   = BADGE_CLS[item.status]  || 'badge text-muted';
    const lbl     = STATUS_LBL[item.status] || '?';
    const row = document.createElement("div");
    row.className = "mon-row";
    row.innerHTML = `
      <div class="mon-dot ${dotCls} ${item.status === 'ok' ? '' : 'pulse'}"></div>
      <div class="mon-icon ${iconCls}"><i class="bi ${item.icon}"></i></div>
      <div class="mon-label">${item.label}</div>
      <div class="mon-detail" title="${item.detail}">${item.detail || '—'}</div>
      <div class="mon-ago">${item.ago || ''}</div>
      <span class="${badge} ms-2" style="font-size:.65rem;padding:2px 7px;border-radius:4px;">${lbl}</span>
    `;
    container.appendChild(row);
  }
  document.getElementById("spinner-row").style.display = "none";
}

async function fetchNow() {
  clearInterval(timer);
  clearInterval(barTimer);
  document.getElementById("ts-label").textContent = "Actualizando...";
  document.getElementById("refresh-bar").style.width = "0%";
  try {
    const resp = await fetch("/monitor/data");
    const data = await resp.json();
    renderRows(data);
  } catch(e) {
    document.getElementById("ts-label").textContent = "Error: " + e;
  }
  startCountdown();
}

function startCountdown() {
  countdown = REFRESH_SECS;
  clearInterval(barTimer);
  barTimer = setInterval(() => {
    countdown = Math.max(0, countdown - 0.5);
    const pct = (countdown / REFRESH_SECS) * 100;
    document.getElementById("refresh-bar").style.width = pct + "%";
  }, 500);

  clearInterval(timer);
  timer = setInterval(fetchNow, REFRESH_SECS * 1000);
}

// Arrancar
document.getElementById("spinner-row").style.display = "block";
fetchNow();
</script>
{% endblock %}
