<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Code Review Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0}
  .header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:24px 32px;border-bottom:1px solid #334155}
  .header h1{font-size:1.8rem;font-weight:700;color:#f1f5f9}
  .header p{color:#94a3b8;margin-top:4px;font-size:.9rem}
  .stats{display:flex;gap:16px;padding:24px 32px;flex-wrap:wrap}
  .stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px 24px;flex:1;min-width:140px}
  .stat .val{font-size:2rem;font-weight:700}
  .stat .lbl{color:#94a3b8;font-size:.8rem;margin-top:4px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 32px 24px}
  .chart-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}
  .chart-card h3{font-size:1rem;color:#cbd5e1;margin-bottom:16px}
  .chart-wrap{position:relative;height:260px}
  .table-wrap{padding:0 32px 32px}
  .table-card{background:#1e293b;border:1px solid #334155;border-radius:12px;overflow:hidden}
  .table-card h3{padding:16px 20px;font-size:1rem;color:#cbd5e1;border-bottom:1px solid #334155}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{background:#0f172a;padding:10px 16px;text-align:left;color:#64748b;font-weight:600;text-transform:uppercase;font-size:.75rem;letter-spacing:.05em}
  td{padding:10px 16px;border-bottom:1px solid #0f172a}
  tr:hover td{background:rgba(15,23,42,.3)}
  .hbar{display:flex;align-items:center;gap:8px}
  .bar{height:6px;border-radius:3px}
  .issues-panel{padding:0 32px 32px}
  .issue-card{background:#1e293b;border:1px solid #334155;border-radius:12px;margin-bottom:12px;overflow:hidden}
  .issue-header{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .issue-header:hover{background:#263248}
  .issue-body{padding:0 16px 12px;display:none}
  .issue-body.open{display:block}
  .issue-item{padding:6px 0;border-bottom:1px solid #334155;font-size:.85rem;color:#cbd5e1}
  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
  .bc{background:#7f1d1d;color:#fca5a5}
  .ba{background:#7c2d12;color:#fdba74}
  .bm{background:#713f12;color:#fde047}
  .bb{background:#1e3a5f;color:#93c5fd}
  @media(max-width:768px){.charts{grid-template-columns:1fr}}
</style>
</head>

  <td style="color:${f.todos>0?'#eab308':'#94a3b8'}">${f.todos}</td>
  <td>${f.issues.length}</td>`;
  tb.appendChild(tr);
});
const il=document.getElementById('issues');
sorted.filter(f=>f.issues.length>0).forEach(f=>{
  const ws=f.issues.reduce((w,i)=>SO[i.severity]<SO[w]?i.severity:w,'BAJO');
  const d=document.createElement('div');d.className='issue-card';
  d.innerHTML=`<div class="issue-header" onclick="this.nextElementSibling.classList.toggle('open')">
    <span><span class="badge ${BC[ws]}">${SL[ws]}</span> <code style="font-size:.85rem">${f.file}</code></span>
    <span style="color:#64748b">${f.issues.length} problema(s) ▼</span></div>
    <div class="issue-body">${f.issues.map(i=>`<div class="issue-item"><span class="badge ${BC[i.severity]}">${SL[i.severity]}</span> ${i.msg}</div>`).join('')}</div>`;
  il.appendChild(d);
});
</script>
</body>
</html>
